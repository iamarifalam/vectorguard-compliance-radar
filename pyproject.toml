[project]
name = "vectorguard-compliance-radar"
version = "1.0.0"
description = "Autonomous Enterprise Compliance & Policy Drift Radar powered by MongoDB Atlas Vector Search ($40k Prize Pool)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "pydantic>=2.6.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
